<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting to Eagle View…</title>

<!-- Canonical points at the real homepage — this page is just a redirect stub. -->
<link rel="canonical" href="https://eagleview.pearlfox.io/">

<!-- Tell search engines not to index this URL; only follow the redirect. -->
<meta name="robots" content="noindex, follow">

<!-- HTML-level redirect (fires before body renders, works even with JS disabled). -->
<meta http-equiv="refresh" content="0; url=/">

<!-- JS-level redirect (instant for anyone with JS enabled). replace() so the
     redirect doesn't leave /eagleview.html in the browser back-button history. -->
<script>window.location.replace('/');</script>

<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#030612;color:#E2E8F0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:1rem;}
  a{color:#00E5FF;}
</style>
</head>
<body>
<p>Redirecting to <a href="/">eagleview.pearlfox.io</a>…</p>
</body>
</html>
