<body>
<main>
  <h1 id="title">Returning to Eagle View...</h1>
  <p id="note">If nothing happens, make sure Eagle View is open, then start the Slack sign-in again from the app.</p>
</main>
<script>(function () {
  // Slack sign-in relay. Slack only accepts https redirect addresses for apps shared with other
  // workspaces, so Slack sends the browser here, and this page hands the one-time code to the
  // Eagle View app that is listening on the user's own computer. No secret is stored or used here.
  // The target is fixed; the link can never choose where the code goes.
  var TARGET = 'http://localhost:3743/';
  var ALLOWED = ['code', 'state', 'error'];
  var MAX_LEN = 2048;

  function buildForwardUrl(search) {
    var p = new URLSearchParams(search);
    if (!p.has('code') && !p.has('error')) return null;
    var parts = [];
    ALLOWED.forEach(function (k) {
      var v = p.get(k);
      if (v !== null && v.length <= MAX_LEN) parts.push(k + '=' + encodeURIComponent(v));
    });
    return TARGET + '?' + parts.join('&');
  }

  var url = buildForwardUrl(window.location.search);
  if (url) {
    window.location.replace(url);
  } else {
    document.getElementById('title').textContent = 'Nothing to do here';
    document.getElementById('note').textContent = 'This page is part of the Eagle View Slack sign-in. Please close this tab and start again from the app.';
  }
})();</script>
</body>
